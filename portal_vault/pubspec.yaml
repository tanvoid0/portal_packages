name: portal_vault
description: Account-recoverable vault, multi-backend encrypted storage, and backup orchestration.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.8.1 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  portal_crypto:
    path: ../portal_crypto
  portal_platform:
    path: ../portal_platform
  flutter_dotenv: ^6.0.0
  cryptography: ^2.7.0
  get: ^4.6.6
  http: ^1.2.0
  path_provider: ^2.1.5
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0
  google_sign_in: ^6.2.2
  googleapis: ^14.0.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.13
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
