name: portal_ui_core
description: Design tokens, ThemeExtension, and theme factories for the Portal UI kit.
version: 0.3.0
repository: https://github.com/tanvoid0/portal_packages/tree/main/portal_ui_core

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  animations: ^2.0.11
  flutter_animate: ^4.5.0
  # Pinned by the Flutter SDK; named here only so the import is declared.
  material_color_utilities: ">=0.11.1 <1.0.0"
  shimmer: ^3.0.0
  # 1.x only: 2.x moved to `material_ui`, whose ColorScheme is not Flutter's.
  # 1.9.0 caps material_color_utilities at 0.13.0 (what Flutter pins today);
  # a Flutter bump past that needs a dependency_override or a fork.
  dynamic_color: ^1.9.0
  # Fleet icon set (C7): rounded style, weight 400, opsz 24 via the theme's
  # IconThemeData. Const `Symbols.*_rounded` only, so release builds tree-shake
  # the three fonts down to the glyphs in use.
  material_symbols_icons: ^4.2960.0
  # PortalFormat (G2): number, currency and date patterns per locale.
  intl: ^0.20.2
  # PortalArt (G8): the per-app spot illustrations are SVG strings.
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  # Plus Jakarta Sans is the fleet typeface. Apps that depend on ui_core get it
  # with no font of their own; the registered family is
  # `packages/portal_ui_core/PlusJakartaSans` (Flutter's package-font key).
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
