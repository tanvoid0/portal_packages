name: portal_ui_kit_example
description: Example app for Portal UI Mason bricks.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  device_frame: ^1.4.0
  flutter_animate: ^4.5.2
  flutter_highlight: ^0.7.0
  flutter_slidable: ^4.0.0
  flutter_spinkit: ^5.2.1
  highlight: ^0.7.0
  portal_ui_core:
    path: ../packages/portal_ui_core
  responsive_framework: ^1.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/ui/
