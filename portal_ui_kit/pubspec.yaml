name: portal_ui_kit
description: Umbrella package for the Portal UI kit — re-exports portal_ui_core and the ThemePair / customThemes API used by apps.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  portal_ui_core:
    path: packages/portal_ui_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
