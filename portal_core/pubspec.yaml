name: portal_core

description: Annotation-driven model codegen (JSON, copyWith) plus a local cache and repository base for Portal apps.
version: 1.0.1
repository: https://github.com/tanvoid0/portal_packages/tree/main/portal_core

environment:
  sdk: ">=3.8.1 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  meta: ^1.11.0
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  build: ^2.4.1
  source_gen: ^1.5.0
  analyzer: ^6.4.1
  collection: ^1.17.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

targets:
  $default:
    builders:
      portal_core|modelGenBuilder:
        generate_for:
          - lib/**.dart
          - example/**.dart
          - test/**.dart
        options:
          enabled: true

