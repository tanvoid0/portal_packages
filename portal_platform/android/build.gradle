// Android half of portal_platform.
//
// This package is a plugin only because two things need the PackageManager:
// reading a sibling Portal app's installed version, and asking Android to
// uninstall one. Both are a handful of lines, and doing them here keeps
// QUERY_ALL_PACKAGES — a Play-restricted permission every off-the-shelf
// "installed apps" plugin declares — out of all six apps: the manifest next
// to this file names the Portal packages explicitly instead.
group = 'com.portal.platform'
version = '1.0'

buildscript {
    ext.kotlin_version = '2.2.20'
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories { google(); mavenCentral() }
}

apply plugin: 'com.android.library'

// Flutter 3.44 warns about every plugin that still applies the Kotlin Gradle
// Plugin and points at its built-in Kotlin instead. Not yet: that needs
// `android.builtInKotlin`, which lands in Flutter 3.47, and without KGP here
// the Kotlin above is simply not compiled — portal_recipe (AGP 9) fails at
// GeneratedPluginRegistrant with "cannot find symbol PortalPlatformPlugin".
// The apps' own modules apply KGP under both AGP 8 and 9 for the same reason.
apply plugin: 'kotlin-android'

android {
    namespace 'com.portal.platform'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig { minSdk 26 }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
