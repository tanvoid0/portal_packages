name: portal_platform
description: Shared auth, API client, session, config, deep-link routing, and offline-first sync for Portal apps.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.8.1 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  get_storage: ^2.1.1
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0
  cryptography: ^2.7.0
  portal_crypto:
    path: ../portal_crypto
  flutter_dotenv: ^6.0.0
  app_links: ^7.0.0
  freezed_annotation: ^2.4.1
  intl: ^0.20.2
  flutter_animate: ^4.5.2
  connectivity_plus: ^6.1.0
  uuid: ^4.5.1
  path_provider: ^2.1.5
  sentry_flutter: ^9.21.0
  package_info_plus: ^10.1.0
  local_auth: ^2.3.0
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.7
