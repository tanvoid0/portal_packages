name: portal_platform
description: Shared auth, API client, session, config, deep-link routing, and offline-first sync for Portal apps.
version: 0.1.0
repository: https://github.com/tanvoid0/pocket_portal/tree/main/packages/portal_platform

environment:
  sdk: ">=3.8.1 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  cached_network_image: ^3.3.1
  image_picker: ^1.2.1
  get_storage: ^2.1.1
  http: ^1.2.0
  shared_preferences: ^2.2.2
  # The local store. Cache rows and the sync queue share one database so a
  # write and the mutation that pushes it commit together; see
  # lib/src/storage/portal_database.dart.
  sqflite: ^2.4.1
  flutter_secure_storage: ^10.0.0
  cryptography: ^2.7.0
  portal_crypto: ^0.1.0
  # For AppToast: the sync layer has user-facing outcomes (a write queued, a
  # change the server refused) and every app was wiring the same toasts by
  # hand. portal_ui_core depends only on Flutter, so this adds no weight and
  # no cycle.
  portal_ui_core: ^0.1.0
  flutter_dotenv: ^6.0.0
  app_links: ^7.0.0
  freezed_annotation: ^2.4.1
  intl: ^0.20.2
  flutter_animate: ^4.5.2
  connectivity_plus: ^6.1.0
  uuid: ^4.5.1
  path_provider: ^2.1.5
  sentry_flutter: ^9.21.0
  package_info_plus: ^10.1.0
  # Only for the settings app list: canLaunchUrl answers "is this sibling
  # Portal app installed", launchUrl opens it. Both need the <queries> block in
  # each app manifest; without it canLaunchUrl is false on Android 11+.
  url_launcher: ^6.3.1
  local_auth: ^2.3.0
  local_auth_android: ^1.0.56
  local_auth_darwin: ^1.6.1
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # sqflite has no VM implementation; the ffi one lets the store be tested
  # off-device.
  sqflite_common_ffi: ^2.3.4
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.7

flutter:
  plugin:
    platforms:
      android:
        package: com.portal.platform
        pluginClass: PortalPlatformPlugin
