name: portal_platform
description: Shared auth, API client, session, config, deep-link routing, and offline-first sync for Portal apps.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.8.1 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  cached_network_image: ^3.3.1
  image_picker: ^1.2.1
  get_storage: ^2.1.1
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0
  cryptography: ^2.7.0
  portal_crypto:
    path: ../portal_crypto
  # For AppToast: the sync layer has user-facing outcomes (a write queued, a
  # change the server refused) and every app was wiring the same toasts by
  # hand. portal_ui_core depends only on Flutter, so this adds no weight and
  # no cycle.
  portal_ui_core:
    path: ../portal_ui_kit/packages/portal_ui_core
  flutter_dotenv: ^6.0.0
  app_links: ^7.0.0
  freezed_annotation: ^2.4.1
  intl: ^0.20.2
  flutter_animate: ^4.5.2
  connectivity_plus: ^6.1.0
  uuid: ^4.5.1
  path_provider: ^2.1.5
  sentry_flutter: ^9.21.0
  package_info_plus: ^10.1.0
  # Only for the settings app list: canLaunchUrl answers "is this sibling
  # Portal app installed", launchUrl opens it. Both need the <queries> block in
  # each app manifest; without it canLaunchUrl is false on Android 11+.
  url_launcher: ^6.3.1
  local_auth: ^2.3.0
  google_sign_in: ^6.2.2
  # Sideload updates: installs a downloaded APK through Android's
  # PackageInstaller *session* API. The obvious route — an ACTION_VIEW intent
  # with the apk mime type — opens the installer UI and then fails the commit
  # on current Android; this is the supported path.
  #
  # Its README also asks for READ_/MANAGE_EXTERNAL_STORAGE and a FileProvider.
  # None of that applies here: the plugin reads the file with a plain
  # FileInputStream inside our own process, and the APK is downloaded to this
  # app's cache directory. MANAGE_EXTERNAL_STORAGE is a Play-restricted
  # permission and must not be added for this.
  android_package_installer: ^0.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.7

flutter:
  plugin:
    platforms:
      android:
        package: com.portal.platform
        pluginClass: PortalPlatformPlugin
