name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Landing page is hand-written; the API reference under /api/<pkg>/ is
      # `dart doc` output for every package that has a pubspec.
      - name: Build site
        run: |
          set -e
          mkdir -p _site/api
          cp -r docs/* _site/
          for pkg in portal_*/; do
            pkg=${pkg%/}
            [ -f "$pkg/pubspec.yaml" ] || continue
            echo "== $pkg"
            (cd "$pkg" && flutter pub get && dart doc --output "../_site/api/$pkg")
          done

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
